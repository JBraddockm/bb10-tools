# HttpClient logs through commons-logging, which falls back to java.util.logging and prints a warning on the console
# for every answer of 401 that has no WWW-Authenticate header. Several tests make a scripted device answer exactly
# that, to show what the session does when a device forgets it, so the warning says nothing that the tests do not.
org.apache.commons.logging.Log=org.apache.commons.logging.impl.NoOpLog
